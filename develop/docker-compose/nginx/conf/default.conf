ssl_password_file /ssl/global.pass;

upstream sjut {
  server host.containers.internal:8090;
}

upstream it {
  server host.containers.internal:8080;
}

upstream wc {
  server host.containers.internal:3000;
}

upstream rs {
  server host.containers.internal:5173;
}

upstream mi {
  server host.containers.internal:8040;
}

upstream mi2.mi {
  server host.containers.internal:5174;
}

upstream st {
  server host.containers.internal:8050;
}

upstream pp {
  server host.containers.internal:8060;
}

upstream ia {
  server host.containers.internal:8070;
}

upstream ls {
  server host.containers.internal:8010;
}

upstream cts {
